[project]
name = "terusan-pipelines"
version = "0.1.0"
description = "Ingestion, extraction and normalization pipelines for the Terusan research data warehouse"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2.1",
    "pyarrow>=18.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "structlog>=24.4.0",
    "psycopg[binary]>=3.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
extract = [
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.0",
    "selectolax>=0.3.27",
]

# What the vendored agency scrapers need. They keep `requests` rather than being
# rewritten onto the shared client: their headers encode workarounds that took
# someone a while to find — bi.go.id resets the connection for a short
# User-Agent — and a rewrite risks losing exactly that.
agencies = [
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    # Bank Indonesia publishes SEKI as legacy BIFF `.xls`, which openpyxl
    # cannot open.
    "xlrd>=2.0.1",
]

# SP2KP publishes through a Tableau view that only yields its crosstab to a
# real browser.
browser = [
    "playwright>=1.49.0",
]

# The air-quality source computes its figures in Earth Engine rather than
# downloading a file, so it needs Google's client and an account to run as.
gee = [
    "earthengine-api>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # The SIPRI Milex reader is tested against a workbook the test builds, so
    # the suite needs a workbook library even though openpyxl ships in the
    # `agencies` extra for running it. `pandas` is here for the same reason:
    # the vendored agency scrapers hand back DataFrames, and a suite that could
    # not import them would leave them untested.
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[project.scripts]
terusan = "terusan_pipelines.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terusan_pipelines"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Vendored agency scrapers keep the shape they arrived in. Restyling them would
# bury the next real change in a diff of cosmetic ones, and these modules encode
# workarounds that are easier to verify against their original than to re-read.
extend-exclude = [
    "src/terusan_pipelines/sources/*/legacy/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

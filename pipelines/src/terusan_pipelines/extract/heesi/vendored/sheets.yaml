- key: produksi-pembangkit-listrik
  data_id: 16
  xlsx_sheet: "16_produksi-pembakit-listrik"
  # PDF table "6.4.2 Power Plant Production" (2024 p103, 2025 p119).
  title_regex: "Power Plant Production"
  orientation: years_as_rows
  year_axis_col: 0
  unit: "GWh"
  combined: true
  # 2024 ed stacks a PLN grid + a "PLN Purchase from IPP & PPU / Off Grid" grid
  # on one page (both year-leading) -> the engine keeps only the first (PLN)
  # run. The grouped "Steam PP" header splits into Coal/Oil/Gas/Cofiring
  # sub-columns then "Total"; only the Total maps (var 117), sub-columns null.
  # value_columns follows the 2025 edition's single-grid order (the production
  # edition). The 2024 edition's PLN grid is a prefix of this only through
  # "Gas PP" (pos 10); it then jumps straight to "Gas Engine PP" with no Waste /
  # Wind / Biomass / Sub-Total columns, so on the 2024 validation edition vars
  # 120 (Gas Engine) and 121 (Wind) do not line up - see task-10-report.md.
  value_columns:
    - "Hydro PP"
    - "Geothermal PP"
    - "Solar PP"
    - "Diesel PP"
    - "Steam PP Coal"
    - "Steam PP Oil"
    - "Steam PP Gas"
    - "Steam PP Cofiring"
    - "Total Steam PP"
    - "Combined Gas-Steam PP"
    - "Gas PP"
    - "Waste PP"
    - "Gas Engine PP"
    - "Wind PP"
    - "Biomass PP"
    - "Sub-Total"
  columns:
    "Hydro PP": 109
    "Geothermal PP": 110
    "Solar PP": 111
    "Diesel PP": 112
    "Total Steam PP": 117
    "Combined Gas-Steam PP": 118
    "Gas PP": 119
    "Gas Engine PP": 120
    "Wind PP": 121
  xlsx_value_columns:
    - "PLTA (Air)"
    - "PLTP (Panas Bumi)"
    - "PLTS (Surya)"
    - "PLTD (Diesel)"
    - "PLTU Batu Bara"
    - "PLTU Minyak"
    - "PLTU Gas"
    - "PLTU Cofiring"
    - "Total PLTU (Uap)"
    - "PLTGU (Gas Uap)"
    - "PLTG (Gas)"
    - ""
    - "PLTMG (Mesin Gas)"
    - "PLTB (Bayu)"
    - ""
    - "Sub-Total"
  checks: []

- key: neraca-energi
  data_id: null
  xlsx_sheet: "10_neraca-energi_v2"
  # 2024 ed: "Indonesia Energy Balance Table 2024" p30 (mirrored on p31).
  # 2025 ed: p34 (mirrored p35) + "... 2025 (continued)" p36 for the lower half.
  title_regex: "Indonesia Energy Balance Table"
  orientation: matrix
  unit: "thousand BOE"
  combined: false            # xlsx-only; NOT loaded into ValueData_combined
  row_keys: ["Code", "EnergyBalanceLine"]
  # PDF energy-type column order, left-to-right, mapped to the xlsx sheet-10
  # header names; the trailing "Total" is always the last numeric cell. The
  # 2024 edition prints all 21; the 2025 edition drops "Solar Powered Public
  # Street Lighting ..." (handled at parse time by column count).
  energy_type_columns:
    - "Hydro Power"
    - "Geothermal"
    - "Solar PP & Solar PV"
    - "Wind PP"
    - "Other Renewables"
    - "Solar Powered Public Street Lighting & Energy Saving Lamp"
    - "Industrial Biomass"
    - "Solar Water Heater"
    - "Direct Use of Geothermal"
    - "Traditional Biomass"
    - "Coal"
    - "Briquette"
    - "Natural Gas"
    - "Crude Oil"
    - "Oil Fuel"
    - "Biofuel"
    - "BioGas"
    - "LPG"
    - "Electricity"
    - "LNG"
    - "Total"
  checks: []

- key: produksi-energi
  data_id: 12
  xlsx_sheet: "12_produksi-energi"
  title_regex: "Indonesia Energy Balance Table"
  orientation: derived_from_matrix
  source_key: neraca-energi
  # Total Energy Production = the "Total" column of the "a. Production" (code
  # 110) row of the energy balance table.
  select:
    code: 110
    xlsx_col: "Total"
  unit: "thousand BOE"
  combined: true
  columns:
    "Total Energy Production": 84
  checks: []

- key: domestic-coal-sales
  data_id: 7
  xlsx_sheet: "7_domestic-coal-sales"
  title_regex: "Domestic Coal Sales"
  chapter_hint: 6
  orientation: years_as_rows
  year_axis_col: 0
  header_rows: 0            # text-line parser skips non-year lines automatically
  unit: ton
  combined: true
  columns:
    "Total": null
    "Iron, Steel & Metallurgy": 10
    "Power Plant": 11
    "Cement, Textile, Fertilizer": 12
    "Pulp & Paper": 13
    "Briquette": 14
    "Others": 15
  checks:
    - type: total_equals_sum
      total_col: "Total"
      tolerance: 0.02

- key: lng-coal-export-price
  data_id: 8
  xlsx_sheet: "8_lng-coal-export-price"
  title_regex: "Average Price of LNG and Coal|LNG and Coal FOB Export"
  chapter_hint: 4
  orientation: years_as_rows
  year_axis_col: 0
  header_rows: 0
  unit: "US$"
  combined: true
  # real PDF column positions first (used by the config-order fallback when the
  # PDF header cannot be parsed); the bare "LNG"/"Coal" aliases only help the
  # header matcher and must stay last so they never claim a position slot.
  columns:
    "LNG (US$/MMBTU)": 16
    "Coal (US$/ton)": 17
    "LNG": 16
    "Coal": 17
  checks: []


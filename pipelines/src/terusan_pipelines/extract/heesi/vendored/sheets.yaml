  title_regex: "Coal Supply"
  chapter_hint: 6
  orientation: years_as_rows
  year_axis_col: 0
  header_rows: 0
  unit: ton
  combined: true
  columns:
    "Production": 18
    "Export": 19
    "Import": 20
  checks: []

- key: penjualan-listrik
  data_id: 17
  xlsx_sheet: "17_penjualan-listrik"
  # 2024 edition titles this "6.4.4 Electricity Sales"; 2025 edition retitled it
  # "6.4.4 Electricity Utilization" (matched via the in-table phrase
  # "PLN's Electricity Sales Per Tariff Segment").
  title_regex: "Electricity (Sales|Utilization)"
  orientation: years_as_rows
  year_axis_col: 0
  unit: "GWh"
  combined: true
  # PDF columns left-to-right. The 2025 edition appends a "Non PLN's Electricity
  # Consumption" group + Grand Total after these; the config-order fallback stops
  # at the width below and ignores them.
  # NOTE: data_hessi.xlsx sheet 17 col "Street Lighting" actually holds the PDF's
  # "Social" values; var 125 (Penerangan Jalan) is mapped to the PDF's genuine
  # "Street Lighting" column here - intentional, semantically correct.
  columns:
    "Household": 122
    "Commercial": 123
    "Industry": 124
    "Social": null
    "Street Lighting": 125
    "Government": null
    "Transportation": null
    "Total": null
  checks: []

- key: penjualan-bahan-bakar-domestik
  data_id: 15
  xlsx_sheet: "15_penjualan-bahan-bakar-domest"
  # 2024 & 2025 editions both head the section "6.2.4 Domestic Oil Fuels Sales".
  # The looser "Sales of Fuel" alt matched a prose page, so keep it exact.
  title_regex: "Domestic Oil Fuels Sales"
  orientation: years_as_columns
  row_label_col: 0
  unit: "kilo liter"
  combined: true
  # PDF fuel-type row label -> Variable_combined id (data_id 15). 2013 is absent
  # from both editions (2024 -> 2014..2024, 2025 -> 2015..2025).
  columns:
    "AvGas": 95
    "Avtur": 96
    "RON 88": 97
    "Kerosene": 98
    "Gasoil CN48": 99
    "MDF": 100
    "Fuel Oil": 101
    "Gasoline RON 95": 102
    "Gasoline RON 92": 103
    "Gasoline RON 90": 104
    "Gasoil CN53": 105
    "Gasoil CN51": 106
    "BioGasoil": 107
    "Total Oil Fuel": 108
  checks: []

- key: konsumsi-energi
  data_id: 13
  xlsx_sheet: "13_konsumsi-energi"
  # Canonical series = the "Final Energy Consumption" row of PDF table
  # "1.1 GDP and Energy Indicator" (years as columns). NOT the by-fuel
  # "3.3 Final Energy Consumption by Type" table (different methodology).
  title_regex: "GDP and Energy Indicator"
  orientation: years_as_columns
  xlsx_orientation: years_as_rows
  xlsx_value_columns: ["Final Energy Consumption"]
  row_label_col: 0
  fuzzy_labels: true
  unit: "Thousand BOE"
  combined: true
  columns:
    "Final Energy Consumption": 85
  checks: []

- key: harga-minyak-mentah
  data_id: 11
  xlsx_sheet: "11_harga-minyak-mentah"
  # PDF table "4.1 Crude Oil Price" prints years as COLUMN headers with the
  # crude type as the row label, under a "Crude Oil / Type" spanning header.
  # 2024 ed puts "Type" on its own line below the year row; 2025 ed folds
  # "Crude Oil Type" onto the year-header line - fuzzy_labels absorbs the stray
  # "Type" token either way. data_hessi.xlsx stores it transposed (years down).
  title_regex: "Crude Oil Price"
  orientation: years_as_columns
  xlsx_orientation: years_as_rows
  row_label_col: 0
  fuzzy_labels: true          # "Average 1)" footnote + "Senipah\n..\nCondensate" wrap + "Type" token
  unit: "US$ per barrel"
  combined: true
  # crude-type row label -> Variable_combined id (data_id 11). Both editions'
  # PDF tables start at 2014 (no 2013 column).
  # xlsx sheet 11_harga-minyak-mentah is transposed (years down); its 9 data
  # columns run left-to-right SLC..Average - the exact `columns` order below,
  # so this list is 1:1 with it. Added for Task 12 validation (carry-forward).
  xlsx_value_columns:
    - "SLC"
    - "Arjuna"
    - "Attaka"
    - "Cinta"
    - "Duri"
    - "Widuri"
    - "Belida"
    - "Senipah Condensate"
    - "Average"
  columns:
    "SLC": 75
    "Arjuna": 76
    "Attaka": 77
    "Cinta": 78
    "Duri": 79
    "Widuri": 80
    "Belida": 81
    "Senipah Condensate": 82
    "Average": 83
  checks: []

- key: permintaan-penawaran-minyak
  data_id: 20
  xlsx_sheet: "20_permintaan-penawaran-minyak-"
  title_regex: "Crude Oil Supply and Demand"
  orientation: years_as_rows
  year_axis_col: 0
  subheader_rows: 1          # "Year Crude Crude" + unit rows under the group header
  unit: "thousand bbl"
  combined: true
  # PDF value columns left-to-right. The 4th group "Oil Refinery Input" prints
  # two sub-columns (Crude thousand bbl, then thousand bpd); only the first is
  # mapped, the trailing bpd column is ignored. Both editions start at 2014
  # (2024 ed) / 2015 (2025 ed) - no 2013 row.
  value_columns: ["Production", "Export", "Import", "Oil Refinery Input"]
  columns:
    "Production": 142
    "Export": 143
    "Import": 144
    "Oil Refinery Input": 145
  checks: []

- key: permintaan-penawaran-lpg
  data_id: 21
  xlsx_sheet: "21_permintaan-penawaran-lpg"
  title_regex: "LPG Supply and Demand"
  orientation: years_as_rows
  year_axis_col: 0
  subheader_rows: 1          # "Gas/Oil Refinery" + "Total" sub-header under "Production"
  unit: ton
  combined: true
  # PDF value columns left-to-right: Production splits into Gas Refinery / Oil
  # Refinery / Total; only the Total maps to var 146. Both editions start at
  # 2014 (2024 ed) / 2015 (2025 ed) - no 2013 row.
  value_columns:
    - "Production Gas Refinery"
    - "Production Oil Refinery"
    - "Production"
    - "Export"
    - "Import"
    - "Sales"
  columns:
    "Production": 146
    "Export": 147
    "Import": 148
    "Sales": 149
  checks: []

- key: harga-energi
  data_id: 14
  xlsx_sheet: "14_harga-energi"
  # PDF table "4.4 Energy Price per Energy Unit" (2024 p47, 2025 p55). Chapter 4.
  title_regex: "Energy Price per"
  orientation: years_as_rows
  year_axis_col: 0
  unit: "Thousand Rp/BOE and US$/BOE"
  combined: true
  # Each product prints TWO sub-columns left-to-right: "Thousand Rp/BOE" then
  # "US$/BOE". The combined DB (data_id 14) carries ONE variable per product on
  # the *Thousand Rp/BOE* sub-column (var 86 RON 90 2013 = 954 == xlsx Thousand
  # Rp/BOE, not the 78 US$/BOE figure); every US$ sub-column -> null.
  # Both editions print only 7 of the 9 combined products in this table -
  # RON 92 (87) and Gasoil CN 51 (91) are absent from the PDF table entirely.
  # Both editions start at 2014 (2024 ed) / 2015 (2025 ed); no 2013 row.
  value_columns:
    - "Gasoline (Ron 90) Rp"
    - "Gasoline (Ron 90) US$"
    - "Avtur Rp"
    - "Avtur US$"
    - "Kerosene Rp"
    - "Kerosene US$"
    - "Gasoil CN 48 Rp"
    - "Gasoil CN 48 US$"
    - "LPG (3 Kg) Rp"
    - "LPG (3 Kg) US$"
    - "LPG (12 Kg) Rp"
    - "LPG (12 Kg) US$"
    - "LPG (50 Kg) Rp"
    - "LPG (50 Kg) US$"
  columns:
    "Gasoline (Ron 90) Rp": 86
    "Avtur Rp": 88
    "Kerosene Rp": 89
    "Gasoil CN 48 Rp": 90
    "LPG (3 Kg) Rp": 92
    "LPG (12 Kg) Rp": 93
    "LPG (50 Kg) Rp": 94
  xlsx_value_columns:
    - "Gasoline (Ron 90) Thousand Rp/BOE"
    - "Gasoline (Ron 90) US$/BOE"
    - "Avtur Thousand Rp/BOE"
    - "Avtur US$/BOE"
    - "Kerosene Thousand Rp/BOE"
    - "Kerosene US$/BOE"
    - "Gasoil CN 48 Thousand Rp/BOE"
    - "Gasoil CN 48 US$/BOE"
    - "LPG (3 Kg) Thousand Rp/BOE"
    - "LPG (3 Kg) US$/BOE"
    - "LPG (12 Kg) Thousand Rp/BOE"
    - "LPG (12 Kg) US$/BOE"
    - "LPG (50 Kg) Thousand Rp/BOE"
    - "LPG (50 Kg) US$/BOE"
  checks: []

